name: Build FPG APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -d lib

      - name: Create clean Flutter project
        shell: bash
        run: |
          set -e

          rm -rf .ci_flutter_app

          flutter create \
            --platforms=android \
            --org com.fpg.game \
            --project-name fpg \
            .ci_flutter_app

          rm -rf .ci_flutter_app/lib
          rm -rf .ci_flutter_app/test

          cp -R lib .ci_flutter_app/lib

          if [ -d test ]; then
            cp -R test .ci_flutter_app/test
          fi

          cp pubspec.yaml .ci_flutter_app/pubspec.yaml

      - name: Get dependencies
        working-directory: .ci_flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: .ci_flutter_app
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        working-directory: .ci_flutter_app
        run: flutter test

      - name: Build APK
        working-directory: .ci_flutter_app
        run: flutter build apk --release

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK=".ci_flutter_app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPG-release-APK
          path: .ci_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
