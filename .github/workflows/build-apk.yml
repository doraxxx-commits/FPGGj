name: Build FPG APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci_flutter_app

          flutter create -t app \
            --platforms=android \
            --org com.fpg.game \
            --project-name fpg \
            .ci_flutter_app

          rm -rf .ci_flutter_app/lib .ci_flutter_app/test
          cp -R lib .ci_flutter_app/lib
          cp -R test .ci_flutter_app/test
          cp pubspec.yaml .ci_flutter_app/pubspec.yaml

      - name: Get dependencies
        working-directory: .ci_flutter_app
        run: flutter pub get

      - name: Analyze project
        working-directory: .ci_flutter_app
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        working-directory: .ci_flutter_app
        run: flutter test

      - name: Clean previous build
        working-directory: .ci_flutter_app
        run: flutter clean

      - name: Build release APK
        working-directory: .ci_flutter_app
        run: flutter build apk --release

      - name: Verify APK exists and is valid
        shell: bash
        run: |
          set -euo pipefail

          APK=".ci_flutter_app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"

          test "$SIZE" -gt 1000000

          unzip -t "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f | sort -V | tail -n 1 || true)

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "apksigner not found; ZIP integrity check passed."
          fi

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            .ci_flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            release/FPG-release.apk

          cd release

          zip -9 FPG-release.zip FPG-release.apk
          sha256sum FPG-release.apk > FPG-release.apk.sha256

          unzip -t FPG-release.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPG-release-APK
          path: release/FPG-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: FPG-release-ZIP
          path: |
            release/FPG-release.zip
            release/FPG-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
