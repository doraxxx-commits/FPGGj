name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Automatyczna instalacja i akceptacja wszystkich licencji Android SDK
      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Install Dependencies
        run: flutter pub get
        working-directory: fpg_v23

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release
        working-directory: fpg_v23

      - uses: actions/upload-artifact@v4
        with:
          name: FPG-APK
          path: fpg_v23/build/app/outputs/flutter-apk/app-release.apk
