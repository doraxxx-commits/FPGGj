name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Dodano working-directory
      - run: flutter pub get
        working-directory: fpg_v23

      # Dodano working-directory
      - run: flutter build apk --release
        working-directory: fpg_v23

      # Zaktualizowano ścieżkę pobierania gotowego pliku APK
      - uses: actions/upload-artifact@v4
        with:
          name: FPG-APK
          path: fpg_v23/build/app/outputs/flutter-apk/app-release.apk
