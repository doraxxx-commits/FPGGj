name: Build FPG APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The repository contains the Flutter/Dart source but intentionally does
      # not keep generated Android files. Create them cleanly on the runner.
      - name: Generate Android project
        run: flutter create --platforms=android --org com.fpg.game --project-name fpg .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Clean previous build
        run: flutter clean

      - name: Build release APK
        run: flutter build apk --release --split-per-abi=false

      - name: Verify APK exists and is a valid ZIP/APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 1000000

          # APK is a ZIP container. This catches truncated/corrupt artifacts
          # before GitHub uploads anything.
          unzip -t "$APK"

          # Check Android APK signing/alignment when the Android SDK tools exist.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "apksigner not found; ZIP integrity check passed."
          fi

      - name: Prepare clean release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/FPG-release.apk

          # Create a simple ZIP containing ONLY the APK. This is the ZIP the
          # user can download and extract without an extra GitHub artifact layer.
          cd release
          zip -9 FPG-release.zip FPG-release.apk
          sha256sum FPG-release.apk > FPG-release.apk.sha256
          unzip -t FPG-release.zip

      - name: Upload APK directly
        uses: actions/upload-artifact@v4
        with:
          name: FPG-release-APK
          path: release/FPG-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload clean ZIP + checksum
        uses: actions/upload-artifact@v4
        with:
          name: FPG-release-ZIP
          path: |
            release/FPG-release.zip
            release/FPG-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
